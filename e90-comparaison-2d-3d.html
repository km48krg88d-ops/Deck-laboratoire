<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DECK — Comparaison 2D / 3D v6</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;width:100%;margin:0;overflow:hidden;background:#10233b;color:#edf4fb;font:12px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
#header{height:calc(env(safe-area-inset-top) + 59px);padding:calc(env(safe-area-inset-top) + 9px) 13px 9px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid #e7f1fb27}
#header strong{font-size:12px;letter-spacing:.04em;white-space:nowrap}
#actions{display:flex;gap:6px;justify-content:flex-end;align-items:center}
button,a{font:11px -apple-system,BlinkMacSystemFont,sans-serif;border:1px solid #d5e4f071;border-radius:11px;background:#e4effa14;color:#f0f5fc;padding:9px 10px;text-decoration:none;white-space:nowrap;cursor:pointer}
button[aria-pressed=true]{background:#dfb98b45;border-color:#efcaa5}
#viewport{position:relative;height:calc(100% - env(safe-area-inset-top) - 59px)}
#frames{height:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px;background:#162c48}
.pane{position:relative;min-width:0;height:100%;background:#849bad}
.pane>iframe{width:100%;height:100%;border:0;display:block;background:#c8d4df}
.pane-title{display:none}
#frames.tabbed{display:block;position:relative}
#frames.tabbed .pane{position:absolute;inset:0;width:100%;height:100%;visibility:hidden;pointer-events:none}
#frames.tabbed .pane.active{visibility:visible;pointer-events:auto;z-index:2}
#frames.tabbed .pane-title{left:12px;transform:none;top:8px}
@media(max-width:850px){
 #header{padding-left:8px;padding-right:8px;gap:6px}
 #header strong{display:none}
 #actions{justify-content:space-evenly;width:100%}
 button,a{font-size:10px;padding:8px}
 #sideBySide{display:none}
}
</style></head>
<body><header id="header"><strong>DECK · Comparaison 2D / 3D</strong>
<nav id="actions" aria-label="Comparer les scènes">
<button type="button" id="tab2d" aria-pressed="false">Version 2D</button>
<button type="button" id="tab3d" aria-pressed="false">Version 3D</button>
<button type="button" id="sideBySide" aria-pressed="true">Côte à côte</button>
<a href="./e90-atelier-commandes-002.html?v=8">Atelier E90</a>
</nav></header>
<main id="viewport"><div id="frames">
<section class="pane" id="pane2d"><div class="pane-title">DECK original · 2D</div><iframe title="Version originale DECK en 2D" src="./index.html?source=comparaison2d" loading="eager" allow="clipboard-write"></iframe></section>
<section class="pane" id="pane3d"><div class="pane-title">COMMANDES-002 · 3D</div><iframe title="Copie DECK avec les huit formes 3D" src="./e90-preview-membrane-3d.html?v=6" loading="eager" allow="clipboard-write"></iframe></section>
</div></main>
<script>
(function(){
const frame=document.getElementById('frames'),pane2d=document.getElementById('pane2d'),pane3d=document.getElementById('pane3d');
const buttons={two:document.getElementById('tab2d'),three:document.getElementById('tab3d'),split:document.getElementById('sideBySide')};
let mode=innerWidth<=850?'3d':'split';
function update(){
 const split=mode==='split'&&innerWidth>850;
 frame.classList.toggle('tabbed',!split);
 pane2d.classList.toggle('active',mode==='2d'||split);
 pane3d.classList.toggle('active',mode==='3d'||split);
 buttons.two.setAttribute('aria-pressed',String(mode==='2d'));
 buttons.three.setAttribute('aria-pressed',String(mode==='3d'));
 buttons.split.setAttribute('aria-pressed',String(split));
}
buttons.two.addEventListener('click',()=>{mode='2d';update()});
buttons.three.addEventListener('click',()=>{mode='3d';update()});
buttons.split.addEventListener('click',()=>{mode='split';update()});
addEventListener('resize',()=>{if(mode==='split'&&innerWidth<=850)mode='3d';update()});
update();
})();
</script></body></html>
